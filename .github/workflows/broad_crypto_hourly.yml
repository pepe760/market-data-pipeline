name: Broad crypto hourly bars
on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * *'
permissions:
  contents: read
concurrency:
  group: broad-crypto-hourly-writer
  cancel-in-progress: false
jobs:
  collect:
    if: vars.BROAD_COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r intraday-requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - run: python broad_collect.py cloud --lane crypto1h
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
