name: Private 15-minute research archive
on:
  workflow_dispatch:
  schedule:
    - cron: '19 2 * * *'
permissions:
  contents: read
concurrency:
  group: private-intraday15m-writer
  cancel-in-progress: false
jobs:
  collect:
    if: vars.INTRADAY15M_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r intraday-requirements.txt
      - name: Verify ingestion code before accessing private storage
        run: python -m unittest discover -s tests -v
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Collect bounded 15m bars into private storage
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
        run: python intraday15m.py cloud
