name: Daily collection
on:
  workflow_dispatch:
  schedule:
    - cron: '47 22 * * 1-5'
    - cron: '17 3 * * 2-6'
permissions:
  contents: read
concurrency:
  group: private-market-collection
  cancel-in-progress: false
jobs:
  collect:
    if: vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - run: python -m unittest discover -s tests -v
      - name: Collect and commit private batch
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
        run: python pipeline.py cloud
